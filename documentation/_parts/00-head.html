<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOORA ERP &mdash; User Documentation</title>
<meta name="description" content="Complete user documentation for the SOORA ERP system: getting started, products, orders, payments, SMS, Telebirr, reports, configuration, FAQ and more. Available in English, Amharic, Afaan Oromo, Tigrigna, Somali and Harari.">
<meta name="author" content="SOORA / Yero Printing">
<style>
:root{
  --primary:#1f3a5f;
  --primary-dark:#16263f;
  --primary-light:#2f5589;
  --accent:#0e9f9b;
  --accent-dark:#0b7f7c;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#26303c;
  --muted:#5b6875;
  --border:#e2e8f0;
  --code-bg:#0f172a;
  --warning:#8a6d1d;
  --warning-bg:#fff9e6;
  --danger:#b3261e;
  --danger-bg:#fdecec;
  --success:#1e7f43;
  --success-bg:#e9f7ef;
  --info-bg:#eef6fb;
  --sidebar-w:288px;
  --topbar-h:60px;
  --radius:12px;
  --shadow:0 1px 3px rgba(20,40,70,.08),0 4px 16px rgba(20,40,70,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + 12px)}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px}
a{color:var(--primary-light);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,h5{color:var(--primary);line-height:1.3;margin:0}
::selection{background:var(--accent);color:#fff}

/* ---------- TOPBAR ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--primary);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:.3px;white-space:nowrap}
.topbar .brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6fd7a0);display:grid;place-items:center;font-size:1.1rem;color:#fff}
.burger{display:none;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:1.25rem;padding:6px 11px;border-radius:8px;cursor:pointer}
.topbar .spacer{flex:1}
.topbar .searchbox{flex:1;max-width:560px;position:relative}
.topbar .searchbox input{width:100%;padding:9px 38px 9px 14px;border-radius:24px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-size:.95rem;outline:none;transition:.2s}
.topbar .searchbox input::placeholder{color:rgba(255,255,255,.72)}
.topbar .searchbox input:focus{background:#fff;color:var(--text);border-color:#fff}
.topbar .searchbox .s-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.8);pointer-events:none}
.topbar .searchbox input:focus + .s-ico{color:var(--muted)}
.search-results{position:fixed;top:calc(var(--topbar-h) + 8px);left:50%;transform:translateX(-50%);width:min(640px,94vw);background:#fff;color:var(--text);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.2);max-height:60vh;overflow:auto;z-index:2000;display:none;border:1px solid var(--border)}
.search-results.open{display:block}
.search-results .head{padding:10px 16px;font-size:.78rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--border);background:#fafbfd;position:sticky;top:0}
.search-results .item{padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-results .item:last-child{border-bottom:0}
.search-results .item:hover,.search-results .item.active{background:var(--info-bg)}
.search-results .item .ttl{font-weight:600;color:var(--primary)}
.search-results .item .snip{font-size:.86rem;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-results .empty{padding:20px;text-align:center;color:var(--muted)}
.lang-switch{position:relative}
.lang-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;display:flex;gap:8px;align-items:center}
.lang-btn:hover{background:rgba(255,255,255,.2)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--text);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.2);min-width:220px;overflow:hidden;display:none;z-index:2100;border:1px solid var(--border)}
.lang-menu.open{display:block}
.lang-menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 16px;border:0;background:#fff;cursor:pointer;font-size:.93rem;text-align:left}
.lang-menu button:hover{background:var(--info-bg)}
.lang-menu button .code{color:var(--muted);font-size:.78rem}
.lang-menu button.cur{color:var(--accent-dark);font-weight:700}

/* ---------- LAYOUT ---------- */
.layout{display:flex;padding-top:var(--topbar-h);min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--primary-dark);color:#cfd8e3;flex-shrink:0;position:fixed;top:var(--topbar-h);bottom:0;left:0;overflow-y:auto;padding:16px 0 40px;z-index:900;transition:transform .25s ease}
.sidebar .toc-title{padding:2px 20px 10px;font-size:.75rem;text-transform:uppercase;letter-spacing:1.4px;color:#7d93b0}
.toc a{display:flex;gap:8px;align-items:center;padding:8px 20px;color:#cfd8e3;font-size:.92rem;border-left:3px solid transparent}
.toc a:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
.toc a.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--accent);font-weight:600}
.toc a .arrow{margin-left:auto;font-size:.7rem;transition:transform .2s;color:#6f87a5}
.toc a.open .arrow{transform:rotate(90deg)}
.toc .toc-group{display:none;padding-left:6px}
.toc .toc-group.open{display:block}
.toc .toc-sub{padding-left:16px;display:block}
.toc .sub a{font-size:.85rem;padding:6px 12px;color:#aebccf}
.toc-badge{margin-left:auto;font-size:.68rem;background:var(--accent);color:#fff;border-radius:20px;padding:1px 8px}
.dim{opacity:.45;pointer-events:none}

.content{flex:1;margin-left:var(--sidebar-w);min-width:0}
.content-inner{max-width:980px;margin:0 auto;padding:28px 30px 80px}

/* ---------- SECTIONS & TYPOGRAPHY ---------- */
.doc-section{margin-bottom:14px}
.doc-section:has(.section-title){border:0}
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 60%,var(--accent) 130%);color:#fff;border-radius:var(--radius);padding:34px 30px;box-shadow:var(--shadow)}
.hero h1{color:#fff;font-size:1.9rem;margin-bottom:8px}
.hero p{margin:4px 0;color:#dce6f2}
.hero .badges{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.hero .badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:4px 12px;font-size:.8rem}
.section-title{font-size:1.55rem;font-weight:800;margin:34px 0 4px;padding-top:14px;display:flex;align-items:center;gap:10px}
.section-title .num{background:var(--accent);color:#fff;min-width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;font-size:.95rem}
.section-title .tag-upd{margin-left:auto;font-size:.68rem;background:#e7f6fc;color:#0b5c84;border:1px solid #b9e3f5;padding:3px 10px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sub-title{font-size:1.18rem;font-weight:700;color:var(--primary);margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.h3{font-size:1.02rem;font-weight:700;color:var(--primary);margin:22px 0 8px}
.doc-section p{margin:10px 0}
.doc-section ul,.doc-section ol{margin:10px 0 10px 4px;padding-left:22px}
.doc-section li{margin:5px 0}
.lead{font-size:1.04rem;color:#33404d}
.muted{color:var(--muted)}
.tag{display:inline-block;background:#eef2fb;color:var(--primary-light);border:1px solid #dde6f5;font-size:.75rem;padding:2px 9px;border-radius:20px;margin-right:6px}

/* ---------- CARDS / GRID ---------- */
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h4{margin:0 0 6px;font-size:1rem}
.card p{margin:4px 0;font-size:.92rem;color:var(--muted)}
.card .ico{font-size:1.3rem;margin-bottom:8px}

/* ---------- ALERTS ---------- */
.alert{border-radius:10px;padding:12px 16px;margin:14px 0;font-size:.93rem;border-left:4px solid}
.alert p{margin:4px 0}
.alert-info{background:var(--info-bg);border-color:#2a7fb0}
.alert-warn{background:var(--warning-bg);border-color:var(--warning)}
.alert-danger{background:var(--danger-bg);border-color:var(--danger)}
.alert-success{background:var(--success-bg);border-color:var(--success)}
.alert .a-ttl{font-weight:700}

/* ---------- TABLES ---------- */
.table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table.doc-table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.doc-table th{background:var(--primary);color:#fff;text-align:left;padding:10px 14px;font-weight:600;white-space:nowrap}
.doc-table td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:top}
.doc-table tbody tr:nth-child(even){background:#fafbfd}
.doc-table code{white-space:nowrap}

/* ---------- CODE ---------- */
.codeblock{position:relative;margin:14px 0;border-radius:10px;overflow:hidden;background:var(--code-bg);box-shadow:var(--shadow)}
.codeblock .cb-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#1a2440;color:#9fb0cf;font-size:.76rem;text-transform:uppercase;letter-spacing:.5px}
.codeblock .cb-head .copy{border:0;background:rgba(255,255,255,.12);color:#cfe0ff;border-radius:6px;padding:3px 12px;cursor:pointer;font-size:.76rem;text-transform:none;letter-spacing:0}
.codeblock .cb-head .copy:hover{background:rgba(255,255,255,.22)}
.codeblock pre{margin:0;padding:14px 16px;overflow-x:auto;color:#e6edf7;font-family:Consolas,Menlo,Monaco,"Courier New",monospace;font-size:.85rem;line-height:1.6}
.codeblock pre code{background:none;color:inherit}
code,.inline-code{background:#eef1f6;border:1px solid #e0e6ee;border-radius:5px;padding:1px 6px;font-family:Consolas,Menlo,Monaco,"Courier New",monospace;font-size:.85em;color:#0f3a7a}

/* ---------- SCREENSHOTS ---------- */
.shot{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{font-size:.83rem;color:var(--muted);padding:9px 14px;background:#fafbfd;border-top:1px solid var(--border)}

/* ---------- FAQ ---------- */
.faq-item{border:1px solid var(--border);border-radius:var(--radius);background:#fff;margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
.faq-q{width:100%;text-align:left;background:none;border:0;padding:15px 18px;font-size:.98rem;font-weight:600;color:var(--primary);cursor:pointer;display:flex;align-items:center;gap:10px;font-family:inherit}
.faq-q .c{background:var(--accent);color:#fff;border-radius:50%;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:.75rem;flex-shrink:0}
.faq-q .st{margin-left:auto;transition:transform .2s;font-size:.8rem;color:var(--muted)}
.faq-item.open .faq-q .st{transform:rotate(180deg)}
.faq-a{display:none;padding:0 18px 16px 52px;font-size:.94rem;color:#37424e}
.faq-item.open .faq-a{display:block}

/* ---------- CHANGELOG ---------- */
.changelog{border-left:3px solid var(--border);margin-left:8px;padding-left:22px}
.cl-item{position:relative;margin:20px 0}
.cl-item::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.cl-item .cl-date{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.cl-item h4{margin:2px 0 6px}
.cl-note{display:inline-block;font-size:.72rem;border-radius:6px;padding:2px 8px;margin-left:8px;font-weight:700}
.cl-note.new{background:#e3fbea;color:var(--success)}
.cl-note.fix{background:#fdecec;color:var(--danger)}
.cl-note.improve{background:#e7f6fc;color:#0b5c84}

/* ---------- FORMS ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.form-group label{display:block;font-size:.84rem;font-weight:600;color:var(--primary);margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:.93rem;font-family:inherit;background:#fff;color:var(--text)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:10px 18px;font-size:.92rem;font-weight:600;cursor:pointer;color:#fff;background:var(--primary-light);transition:.15s}
.btn:hover{filter:brightness(1.12);text-decoration:none}
.btn-accent{background:var(--accent)}
.btn-outline{background:#fff;color:var(--primary-light);border:1.5px solid var(--primary-light)}
.btn-danger{background:#c0392b}
.feedback-note{margin-top:10px;font-size:.88rem;padding:8px 12px;border-radius:8px}

/* ---------- STEPS ---------- */
.steps{counter-reset:step;list-style:none;padding:0;margin:14px 0}
.steps > li{position:relative;padding:0 0 18px 46px;counter-increment:step}
.steps > li::before{content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.steps > li::after{content:"";position:absolute;left:15px;top:34px;bottom:4px;width:2px;background:var(--border)}
.steps > li:last-child::after{display:none}
.steps > li b{color:var(--primary)}

/* ---------- CONTACT / ICONS ---------- */
.contact-card{display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);margin:10px 0}
.contact-card .ic{min-width:44px;height:44px;border-radius:12px;background:var(--info-bg);display:grid;place-items:center;font-size:1.25rem;color:var(--primary-light)}
.contact-card h4{margin:0 0 3px}
.contact-card p{margin:1px 0;font-size:.9rem;color:var(--muted)}

/* ---------- LANG NOTE ---------- */
.lang-note{font-size:.82rem;color:var(--muted);border:1px dashed var(--border);background:#fafbfd;border-radius:8px;padding:8px 12px;margin:10px 0}
.trans-missing::after{content:" (EN)";font-size:.7em;color:var(--accent-dark);font-weight:600}

/* ---------- FOOTER ---------- */
.doc-footer{margin-top:50px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:.84rem;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.doc-footer a{color:var(--muted);text-decoration:underline}

/* ---------- SCROLLBAR ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c3cdd9;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#aab7c6}
.sidebar::-webkit-scrollbar-thumb{background:#2c3e5c}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1100px){.topbar .brand span.txt{display:none}.topbar .searchbox{max-width:none}}
@media (max-width:900px){
  .burger{display:block}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.35)}
  .content{margin-left:0}
  .grid.cols-2,.grid.cols-3{grid-template-columns:1fr}
}
@media (max-width:640px){
  :root{--topbar-h:56px}
  .content-inner{padding:20px 14px 60px}
  .hero{padding:24px 18px}
  .hero h1{font-size:1.4rem}
  .section-title{font-size:1.25rem}
  .lang-btn span{display:none}
  .lang-btn{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---------- MARK HIGHLIGHT ---------- */
mark{background:#ffe58a;border-radius:3px;padding:0 2px}

/* ---------- PRINT ---------- */
@media print{
  .topbar,.sidebar{display:none!important}
  .content{margin-left:0!important}
  .content-inner{max-width:100%;padding:10px}
  body{background:#fff;font-size:11.5pt}
  .doc-section,.card,.faq-item,.shot{break-inside:avoid;box-shadow:none}
  a{color:inherit}
}
</style>
</head>
